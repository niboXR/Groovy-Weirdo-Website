project:
  type: website
  output-dir: docs  # GitHub Pages will serve from here
  pre-render:
    - scripts/get-products.R # pull products using shopify API
    - scripts/get-files.R # get markdown files from collaborative obsidian vault
  post-render:
  - scripts/cleanup.R #cleanup redundant files from prerender
  resources: 
    - CNAME
website:
  title: "Groovy Weirdo Art"
  site-url: "https://www.groovyweirdo.com"
  description: "Groovy Weirdo art portfolio and shop"
  image: "assets/images/groovy-weirdo-logo-360x180.png"
  favicon: assets/images/groovy-weirdo-icon.svg
  announcement: 
    icon: cone-striped
    dismissable: true
    content: "This site is in development. [Report an issue](https://github.com/niboXR/Groovy-Weirdo-Website/issues)."
    position: below-navbar
    type: secondary #options include primary, secondary, success, danger, warning, info, light, dark
    
  open-graph:
    title: "Groovy Weirdo Art" #Repeated for open graph seperately due to Quarto bug
    description: "Groovy Weirdo art portfolio and shop"
    image: "assets/images/groovy-weirdo-logo-360x180.png"
    image-width: 1200
    image-height: 630
  navbar:
    title: false
    logo: large
    logo-alt: "Groovy Weirdo logo linked to home page"
    search: false
    left:
      - href: index.md   # Home page link
        text: Home
        aria-label: "Home"
      - href: about.md  # About link
        text: About
        aria-label: "About"
      - href: portfolio.md   # Portfolio
        text: Portfolio
        aria-label: "Portfolio"
      - href: shop.md   # Shop
        text: Shop
        aria-label: "Shop"

        
  # Define website footer
  page-footer:
    background: primary
    border: false
    left:
      - icon: instagram
        href: https://www.instagram.com/groovyweirdo_/
        aria-label: Instagram
      - icon: tiktok
        href: https://www.tiktok.com/@groovy_weirdoo/
        aria-label: TikTok
    right: "© 2026 Groovy Weirdo. All rights reserved."

        
format:
  html:
    theme: [custom.scss, brand]
      # - none # No bootswatch themeing
      # - _brand.yml
      # - custom.scss           # Injected on top of the brand layer
    css: assets/styles.css      # custom CSS injected client-side
    toc: false            # Adds a Table of Contents to pages
    page-layout: full
    from: markdown+emoji
    axe: 
      output: console #shows in console, use 'document' to show on page on 'quarto preview'
      