project:
  type: website
  output-dir: docs  # GitHub Pages will serve from here
  pre-render: scripts/get-files.r # get markdown files from collaborative obsidian vault
  resources: 
    - CNAME
website:
  site-url: "https://www.groovyweirdo.com"
  title: "Groovy Weirdo Art"
  description: "Groovy Weirdo art portfolio and shop"
  image: "assets/images/groovy-weirdo-logo-360x180.png"
  favicon: assets/images/groovy-weirdo-icon.svg
  open-graph:
    title: "Groovy Weirdo Art" #Repeated for open graph seperately due to Quarto bug
    description: "Groovy Weirdo art portfolio and shop"
    image: "assets/images/groovy-weirdo-logo-360x180.png"
    image-width: 1200
    image-height: 630
  navbar:
    title: false
    logo: large
    search: false
    left:
      - href: index.md   # Home page link
        text: Home
      - href: pages/About.md  # About link
        text: About
      - href: pages/Portfolio.md   # Portfolio
        text: Portfolio
    right:
      - href: pages/Shop.md   # Shop
        text: Shop
format:
  html:
    theme: default         # Sets the site's visual style
    css: assets/styles.css      # Links an optional custom CSS file
    toc: false            # Adds a Table of Contents to pages