<script>
const starRating = document.querySelector('.star-rating');
const stars = document.querySelectorAll('.star');
const ratingInput = document.getElementById('ratingRange');
const ratingOutput = document.getElementById('ratingOutput');
const reviewForm = document.getElementById('reviewForm');
const formStatus = document.getElementById('formStatus');
const submitBtn = document.getElementById('submitBtn');


// 1. Update the rating stars display dynamically

function paint(value) {
  stars.forEach(star => {
    star.classList.toggle('filled', Number(star.dataset.value) <= value);
  });
}

function setRating(value) {
  ratingInput.value = value;
  //ratingOutput.textContent = `${value} / 5 Stars`;
  stars.forEach(star => {
    star.setAttribute('aria-checked', Number(star.dataset.value) === value);
  });
  paint(value);
}

stars.forEach(star => {
  star.addEventListener('click', () => setRating(Number(star.dataset.value)));
  star.addEventListener('mouseenter', () => paint(Number(star.dataset.value)));
});

// Revert to the committed rating once the mouse leaves the whole group
starRating.addEventListener('mouseleave', () => paint(Number(ratingInput.value)));

// Initialize on load
setRating(Number(ratingInput.value));


// 2. Handle the image upload
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 3. Handle the form submission in the background
reviewForm.addEventListener('submit', async (e) => {   // <-- added "async" here
  e.preventDefault(); // Prevents the page from hanging/redirecting
 
  // Timestamp
  document.getElementById('submittedAt').value = new Date().toISOString();
 
  // Grab the selected file (if any)
  const fileInput = document.getElementById('reviewImage');
  const file = fileInput.files[0];   // <-- this line was missing
 
  // Image validation
  const MAX_SIZE = 5 * 1024 * 1024; // 5MB
  const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
 
  if (file) {
    if (!ALLOWED_TYPES.includes(file.type)) {
      formStatus.textContent = "Please upload a JPG, PNG, or WebP image.";
      formStatus.className = "form-status error";
      return;
    }
    if (file.size > MAX_SIZE) {
      formStatus.textContent = "Image is too large. Please choose one under 5MB.";
      formStatus.className = "form-status error";
      return;
    }
  }
 
  // On submission, disable button and show loading text
  submitBtn.disabled = true;
  formStatus.textContent = "Submitting your review...";
  formStatus.className = "form-status";
 
  // Build the payload manually — field names here must match
  // what your Apps Script reads on the other side
  const payload = {
    productId: reviewForm.productId.value,
    productHandle: reviewForm.productHandle.value,
    submittedAt: reviewForm.submittedAt.value,
    secretToken: reviewForm.secretToken.value,
    rating: reviewForm.rating.value,
    reviewerName: reviewForm.reviewerName.value,
    reviewerEmail: reviewForm.reviewerEmail.value,
    reviewContent: reviewForm.reviewContent.value
  };
 
  if (file) {
    payload.fileData = await fileToBase64(file);
    payload.fileName = file.name;
    payload.fileType = file.type;
  }
 
  // Send data to your Google Apps Script URL as JSON
  fetch(reviewForm.action, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: {
      'Content-Type': 'text/plain'   // avoids a CORS preflight Apps Script can't handle
    },
    mode: 'cors'
  })
  .then(response => response.json())
  .then(data => {
    if (data.result === 'success') {
      formStatus.textContent = "Thank you! Your review has been submitted and will be posted after it is verified.";
      formStatus.className = "form-status success";
      reviewForm.reset();
      setRating(5);
    } else {
      throw new Error(data.error);
    }
  })
  .catch(error => {
    formStatus.textContent = "Oops! Something went wrong. Please try again.";
    formStatus.className = "form-status error";
    console.error('Submission Error:', error);
  })
  .finally(() => {
    submitBtn.disabled = false;
  });
});


</script>
